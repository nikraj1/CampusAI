[project]
name = "campusai-ai"
version = "1.0.0"
description = "CampusAI AI service: LLM gateway, RAG, ingestion, agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyJWT>=2.8",
  "httpx>=0.27",
  "fastembed>=0.4",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "pymupdf4llm>=0.0.17",
  "python-docx>=1.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["campusai_ai*"]
